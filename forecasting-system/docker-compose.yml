# =====================================================
# Docker Compose - Time Series Forecasting System
# =====================================================
version: "3.9"

services:
  forecasting-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forecasting-api
    ports:
      - "8000:8000"
    volumes:
      - ./app/saved_models:/app/app/saved_models
      - ./metadata:/app/metadata
      - ./metrics:/app/metrics
      - ./reports:/app/reports
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
